name: Feature or documentation request
description: Explain a use case or propose a documentation improvement.
title: "[Request]: "
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/DavidOsipov/NevroTick/blob/main/ROADMAP.md) and existing issues first. Planned capabilities and supported releases are different things; a proposal does not change accepted product scope.

        Do not disclose vulnerabilities here. Use [private vulnerability reporting](https://github.com/DavidOsipov/NevroTick/security/advisories/new) or the fallback in [SECURITY.md](https://github.com/DavidOsipov/NevroTick/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is missing or unclear? For documentation, link the relevant page or section.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the behavior or clarification you would like, including how someone could check that it helps. A complete implementation design is not required.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Alternatives and context
      description: Optional workarounds, relevant platforms, accessibility needs, or links to existing decisions/tasks. Avoid private information.
