name: Rust product checks

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  portable:
    name: UI-M0 portable model
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the Linux sandbox and host Fontconfig prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap apparmor-profiles pkg-config libfontconfig-dev
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          bwrap --version
          bwrap --unshare-all --die-with-parent --new-session --cap-drop ALL --clearenv \
            --ro-bind / / -- /usr/bin/true
          env -i PATH=/usr/bin:/bin /usr/bin/pkg-config --exists fontconfig
      - name: Verify required CPU and hardening policy in isolation
        run: |
          check_isolated() {
            timeout --kill-after=5s 180s \
              bwrap --unshare-all --die-with-parent --new-session --cap-drop ALL --clearenv \
                --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
                --ro-bind "${GITHUB_WORKSPACE}" /repo \
                --size 67108864 --tmpfs /tmp --dir /tmp/home \
                --proc /proc --dev /dev --chdir /repo \
                --setenv PATH /usr/bin:/bin --setenv HOME /tmp/home \
                --setenv TMPDIR /tmp --setenv LANG C.UTF-8 \
                -- /usr/bin/prlimit --cpu=60 --as=1073741824 --nproc=128 \
                  --nofile=128 --fsize=16777216 -- "$@"
          }
          check_isolated /usr/bin/python3 -X dev -Werror -B -m unittest discover \
            -s scripts/tests -p test_check_environment.py -v
          check_isolated /usr/bin/python3 -B .agents/skills/scripts/check_skills.py
      - name: Challenge product admission and result accounting
        run: |
          python3 -X dev -Werror -B -m unittest discover -s scripts/tests -p test_verify.py -v
          python3 -X dev -Werror -B -m unittest discover -s scripts/tests -p test_ui_text_coverage.py -v
          python3 -X dev -Werror -B -m unittest discover -s scripts/tests -p test_ui_text_codegen.py -v
          python3 -X dev -Werror -B -m unittest discover -s scripts/tests -p test_ui_text_native.py -v
          python3 -X dev -Werror -B scripts/check-ui-text.py --root .
          python3 -X dev -Werror -B -m unittest discover -s scripts/tests -p test_slint_dependency_profile.py -v
          python3 -X dev -Werror -B -m unittest discover -s scripts/tests -p test_accesskit_path_patch.py -v
          python3 -X dev -Werror -B -m unittest discover -s scripts/tests -p test_slint_linux_sdk.py -v
          python3 -X dev -Werror -B -m unittest discover -s scripts/tests -p test_prepare_product.py -v
          python3 -X dev -Werror -B -m unittest discover -s scripts/tests -p test_refresh_product_advisories.py -v
          python3 -X dev -Werror -B -m unittest discover -s scripts/tests -p test_advisory_snapshot_admission.py -v
          python3 -X dev -Werror -B -m unittest discover -s scripts/tests -p test_bounded_download.py -v
          python3 -X dev -Werror -B -m unittest discover -s scripts/tests -p test_xwin_setup.py -v
      - name: Check native keyboard and IME source custody
        run: python3 -X dev -Werror -B -m unittest discover -s scripts/tests -p test_native_input_source.py -v
      - name: Acquire the pinned compiler in private runner storage
        run: python3 -B .github/security/prepare_rust.py
      - name: Exercise the actual AccessKit subclass through the portable facade
        env:
          ACCESSKIT_CONTROLS: ${{ runner.temp }}/accesskit-subclass-controls
        run: |
          python3 -B scripts/verify-accesskit-subclass.py \
            --toolchain-dir "${RUSTUP_HOME}/toolchains/1.99.1-x86_64-unknown-linux-gnu" \
            --output-dir "${ACCESSKIT_CONTROLS}"
      - name: Acquire the reviewed vendor bytes without executing package code
        env:
          VENDOR_DIR: ${{ runner.temp }}/ui-m0-vendor
        run: python3 -B scripts/prepare-product.py --vendor-dir "${VENDOR_DIR}"
      - name: Acquire pinned test and dependency tools and verify before execution
        working-directory: ${{ runner.temp }}
        run: |
          download_pinned() {
            local attempt
            for attempt in 1 2 3; do
              if timeout --kill-after=5s 180s python3 -B "${GITHUB_WORKSPACE}/scripts/bounded_download.py" \
                --url "$1" --destination "$2" --sha256 "$3" --maximum-bytes 33554432 \
                --allowed-origin https://github.com \
                --allowed-origin https://release-assets.githubusercontent.com; then
                return 0
              fi
              if [[ "${attempt}" != 3 ]]; then sleep 2; fi
            done
            return 1
          }
          download_pinned \
            'https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.150/cargo-nextest-0.9.150-x86_64-unknown-linux-gnu.tar.gz' \
            nextest.tar.gz b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f
          echo 'b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f  nextest.tar.gz' | sha256sum --check --strict
          mkdir nextest-tool
          tar --extract --gzip --file nextest.tar.gz --directory nextest-tool cargo-nextest
          echo '62dcc4348e189f5fbd5881f6b753c59d62f2e664b28c6357898644288d703c02  nextest-tool/cargo-nextest' | sha256sum --check --strict
          download_pinned \
            'https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz' \
            deny.tar.gz 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          echo '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  deny.tar.gz' | sha256sum --check --strict
          mkdir deny-tool
          tar --extract --gzip --file deny.tar.gz --directory deny-tool --strip-components=1 \
            cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
          echo 'b329e25933d01c36dd7c47d84ea5716694f9b7caf53a5003d45674703a8ed54a  deny-tool/cargo-deny' | sha256sum --check --strict
      - name: Acquire current advisory and registry metadata separately
        env:
          METADATA_HOME: ${{ runner.temp }}/ui-m0-metadata
          METADATA_RECEIPT: ${{ runner.temp }}/ui-m0-metadata.json
          DENY_BINARY: ${{ runner.temp }}/deny-tool/cargo-deny
        run: |
          metadata_quota=$(mktemp -d "${RUNNER_TEMP}/ui-m0-metadata-quota.XXXXXX")
          cleanup_metadata_quota() {
            local status=$?
            if sudo umount -- "${metadata_quota}"; then
              if ! rmdir -- "${metadata_quota}"; then
                if [[ "${status}" == 0 ]]; then status=1; fi
              fi
            else
              if [[ "${status}" == 0 ]]; then status=1; fi
            fi
            exit "${status}"
          }
          quota_uid=$(id -u)
          quota_gid=$(id -g)
          sudo mount -t tmpfs -o "size=512m,nr_inodes=16384,nodev,nosuid,noexec,mode=700,uid=${quota_uid},gid=${quota_gid}" \
            tmpfs "${metadata_quota}"
          trap cleanup_metadata_quota EXIT
          python3 -B scripts/refresh-product-advisories.py \
            --acquisition-root "${metadata_quota}" \
            --cargo-home "${METADATA_HOME}" --receipt "${METADATA_RECEIPT}" \
            --deny "${DENY_BINARY}" \
            --toolchain-dir "${RUSTUP_HOME}/toolchains/1.99.1-x86_64-unknown-linux-gnu"
      - name: Check the frozen dependency graph before package code executes
        env:
          PRODUCT_SCRATCH: ${{ runner.temp }}
          VENDOR_DIR: ${{ runner.temp }}/ui-m0-vendor
          METADATA_RECEIPT: ${{ runner.temp }}/ui-m0-metadata.json
          DENY_BINARY: ${{ runner.temp }}/deny-tool/cargo-deny
          DEPENDENCY_RECEIPT: ${{ runner.temp }}/ui-m0-dependencies.json
        run: |
          python3 -B scripts/verify.py --lane dependencies \
            --toolchain-dir "${RUSTUP_HOME}/toolchains/1.99.1-x86_64-unknown-linux-gnu" \
            --vendor-dir "${VENDOR_DIR}" --scratch-root "${PRODUCT_SCRATCH}" \
            --deny "${DENY_BINARY}" --advisory-receipt "${METADATA_RECEIPT}" \
            --json "${DEPENDENCY_RECEIPT}"
      - name: Verify actual portable product code in the isolated row
        env:
          PRODUCT_SCRATCH: ${{ runner.temp }}
          VENDOR_DIR: ${{ runner.temp }}/ui-m0-vendor
          NEXTEST_BINARY: ${{ runner.temp }}/nextest-tool/cargo-nextest
          PRODUCT_RECEIPT: ${{ runner.temp }}/ui-m0-portable.json
        run: |
          python3 -B scripts/verify.py --lane portable \
            --toolchain-dir "${RUSTUP_HOME}/toolchains/1.99.1-x86_64-unknown-linux-gnu" \
            --vendor-dir "${VENDOR_DIR}" --scratch-root "${PRODUCT_SCRATCH}" \
            --nextest "${NEXTEST_BINARY}" --json "${PRODUCT_RECEIPT}"
