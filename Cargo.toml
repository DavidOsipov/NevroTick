[workspace]
members = ["crates/nevrotick-ui", "crates/ntp-wire", "crates/time-domain", "crates/ntp-exchange"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "GPL-2.0-only"
repository = "https://github.com/DavidOsipov/NevroTick"

# Workspace policy adopted from the canonical bootstrap Cargo fragment.
# Every first-party member must opt in with
# [lints]
# workspace = true
# scripts/check-strict.py checks policy adoption in the actual workspace.
#
# deny permits reviewed, narrowly scoped expectations in Windows adapters.
# Pure domain/protocol/numerical crate roots additionally forbid unsafe_code.
# Keep broad groups at priority -1 and individual rules at the default 0.

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_unsafe = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unknown_lints = "deny"
renamed_and_removed_lints = "deny"
improper_ctypes = "deny"
improper_ctypes_definitions = "deny"
unexpected_cfgs = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Require a documented contract surface for private helpers as well as public
# APIs. Documentation presence does not prove pre/postconditions are correct.
missing_docs_in_private_items = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
# Prefer checked expectations over permanent local suppressions, and make each
# unsafe block carry one reviewable operation. Keep legitimate used .ok() values.
allow_attributes = "deny"
multiple_unsafe_ops_per_block = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
let_underscore_must_use = "deny"
as_conversions = "deny"
mem_forget = "deny"
exit = "deny"

# Stable rustdoc::all also checks crate documentation, code blocks, HTML,
# backticks and private-item examples. Doctests run separately.
# It does not include the nightly-only missing_doc_code_examples lint.
[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

# Runtime-optimization candidate: higher compile/link cost, no measured speed claim.
# ThinLTO optimizes across Rust crates; one codegen unit favors optimization over
# build parallelism. The dev profile keeps Cargo's fast incremental defaults.
# See docs/windows-time-development-hardening.md, section 6.5, for Windows/PGO
# limits. The compiler guide's reproducer differs from ordinary application LTO,
# but broader Windows dllimport risks (#27438) still need native qualification.
# ThinLTO is an unqualified candidate; do not copy compiler bootstrap.toml options.
# Keep arithmetic checks, unwind qualification policy and matching debug symbols;
# no shipping component fault policy is selected by these optimization settings.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true
debug-assertions = false
panic = "unwind"
incremental = false
debug = "limited"
strip = "none"

[profile.verify-release]
inherits = "release"
debug-assertions = true
