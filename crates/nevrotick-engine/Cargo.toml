[package]
name = "nevrotick-engine"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded NevroTick observe-only engine transport experiment"

[dependencies]
garde = { version = "=0.23.0", default-features = false, features = ["derive"] }
getrandom = { version = "=0.4.3", default-features = false }
ntp-wire = { version = "=0.0.0", path = "../ntp-wire" }
time-domain = { version = "=0.0.0", path = "../time-domain" }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }

# The reviewed tokio-macros 2.7.2 lock uses Syn 3 on the host; garde keeps Syn 2.
# Both target and per-package feature rows admit these separate macro closures.
# Do not add an unused direct macro dependency or call its private helpers.

[[bin]]
name = "nevrotick-observe"
path = "src/bin/nevrotick-observe.rs"

[lints]
workspace = true
