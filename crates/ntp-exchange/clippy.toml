# Pinned Clippy 0.1.99. This package is a pure fixture library.
# Keep all common settings synchronized with the admitted root configuration.
check-private-items = true
allow-unwrap-in-tests = false
allow-expect-in-tests = false
allow-panic-in-tests = false
allow-dbg-in-tests = false

