schema_version = 1

[product]
name = "NevroTick"
publisher = "David Osipov"
description = "A Windows time synchronization client under development."
homepage = ""

[platform]
target = "x86_64-pc-windows-msvc"
cpu_floor = "x86-64-v3"

[version_policy]
# Prototype-only numeric mapping: Cargo major.minor.patch plus this revision.
# A release mapping and full product qualification remain explicitly pending.
file_version_revision = 0

[components.ui]
role = "ui"
state = "fixture"
display_name = "NevroTick"
description = "Fixture-only NevroTick UI-M0 prototype"
cargo_manifest = "crates/nevrotick-ui/Cargo.toml"
binary_name = "nevrotick-ui"

[components.observe]
role = "observer"
state = "experiment"
display_name = "NevroTick Observe"
description = "Bounded unauthenticated, observe-only transport experiment"
cargo_manifest = "crates/nevrotick-engine/Cargo.toml"
binary_name = "nevrotick-observe"

[components.engine]
role = "engine"
state = "planned"
display_name = "NevroTick Synchronization Engine"
description = "Planned synchronization service; not implemented or qualified"

[components.broker]
role = "broker"
state = "planned"
display_name = "NevroTick Clock Broker"
description = "Planned privileged clock broker; not implemented or qualified"

[components.helper]
role = "helper"
state = "planned"
display_name = "NevroTick Administration Helper"
description = "Planned lifecycle helper; not implemented or qualified"

