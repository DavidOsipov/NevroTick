# UI-M0, pure wire, checked time-domain, fixture exchange, numerical owners and atomic fixture-history ownership.
# This inventory records scope, not completed coverage or mutation qualification.
schema_version = 1
status = "five-member-scope-recorded-qualification-candidate-specific"
security_module_minimum_executable_line_percent = 90
critical_file_minimum_mutation_percent = 95
security_modules = [
    { name = "preview-admission", package = "nevrotick-ui", files = ["crates/nevrotick-ui/src/model.rs"], scope = "local prototype fields only; no production authority" },
    { name = "ntp-fixed-header", package = "ntp-wire", files = ["crates/ntp-wire/src/header.rs"], scope = "inert fixed binary header only; no exchange, authentication, time or clock authority" },
    { name = "ntp-outer-framing", package = "ntp-wire", files = ["crates/ntp-wire/src/datagram.rs"], scope = "bounded complete no-legacy-MAC outer framing only; no exchange, authentication, era or sample admission" },
    { name = "time-coordinate-construction", package = "time-domain", files = ["crates/time-domain/src/coordinate.rs"], scope = "private checked Q32 coordinate envelope; caller-supplied values establish no UTC truth" },
    { name = "time-era-resolution", package = "time-domain", files = ["crates/time-domain/src/era.rs"], scope = "mandatory garde window construction and exact unique-era resolution; no trusted-anchor acquisition" },
    { name = "time-exchange-arithmetic", package = "time-domain", files = ["crates/time-domain/src/exchange.rs"], scope = "exact offset and signed RTT arithmetic; no live exchange, authentication or sample admission" },
    { name = "time-clock-domains", package = "time-domain", files = ["crates/time-domain/src/clock.rs"], scope = "distinct monotonic and active-awake units with checked same-domain elapsed results; no native clock readings" },
    { name = "time-nanosecond-rounding", package = "time-domain", files = ["crates/time-domain/src/rounding.rs"], scope = "checked ties-even signed nanosecond conversion and exact residuals; no FILETIME or clock correction" },
    { name = "exchange-context-construction", package = "ntp-exchange", files = ["crates/ntp-exchange/src/context.rs"], scope = "private checked fixture identities, generations, token and timing context; no native identity or entropy claims" },
    { name = "exchange-current-request-admission", package = "ntp-exchange", files = ["crates/ntp-exchange/src/association.rs"], scope = "single-slot current binding and request guards, receive completion and private result construction; no authentication, eligible sample or clock authority" },
    { name = "regression-checked-construction-and-fit", package = "time-core", files = ["crates/time-core/src/regression.rs"], scope = "synthetic point/batch/private result construction and bounded coefficient fit; no eligible samples, history, confidence, selection or clock authority" },
    { name = "residual-statistic-construction-and-publication", package = "time-core", files = ["crates/time-core/src/regression/residuals.rs"], scope = "fresh associated line plus checked weighted SSE, residual scale and normalized data variance; mandatory scalar validation and exact typed errors; no uncertainty, history, eligibility or clock authority" },
    { name = "fixture-observation-normalization", package = "time-core", files = ["crates/time-core/src/regression/normalization.rs"], scope = "checked fixture context/Q33 admission and exact newest-reference normalization to a fresh owned FitInput; bounded read-only point observation; no history, eligible sample, native clock or authenticated provenance" },
    { name = "fixture-history-atomic-append-and-report", package = "time-core", files = ["crates/time-core/src/regression/history.rs"], scope = "exclusive bounded fixture append, context/order admission, staged oldest-only replacement and failure-atomic same-input report commit; no production retention, prune/reset/freshness, provenance, native clock or correction authority" },
    { name = "fixture-residual-runs-and-suffix-selection", package = "time-core", files = ["crates/time-core/src/regression/runs.rs"], scope = "bounded immutable fixture suffix search, extended residual runs, checked stage/position errors and associated same-fit diagnostics; no history pruning, source selection, physical uncertainty or clock authority" },
]
