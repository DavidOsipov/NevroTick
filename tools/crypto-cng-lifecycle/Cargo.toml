[package]
name = "nevrotick-crypto-cng-lifecycle"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-2.0-only"
publish = false
build = false
description = "Held native Windows CNG lifecycle fixture with public API controls"

# Experimental test infrastructure, outside the product workspace.
[workspace]
resolver = "3"
exclude = ["vendor/rustls-cng-crypto", "vendor/rustls-platform-verifier"]

[features]
init-probe = ["rustls-cng-crypto/fixture-init-probe"]

[[bin]]
name = "nevrotick-cng-init-probe"
path = "src/bin/init-probe.rs"
required-features = ["init-probe"]

[[bin]]
name = "nevrotick-nts-ke-probe"
path = "src/bin/nts-ke-probe.rs"

[patch.crates-io]
rustls-cng-crypto = { path = "vendor/rustls-cng-crypto" }
rustls-platform-verifier = { path = "vendor/rustls-platform-verifier" }

# Pure typed admission/response owners; no host TLS provider or fallback.
[dependencies]
ntp-wire = { version = "=0.0.0", path = "../../crates/ntp-wire", default-features = false }
rustls-pki-types = { version = "=1.15.1", default-features = false, features = ["std"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std"] }
rustls-cng-crypto = { version = "=0.1.2", default-features = false }
rustls-platform-verifier = { version = "=0.7.1", default-features = false }

[lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_unsafe = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unknown_lints = "deny"
renamed_and_removed_lints = "deny"
improper_ctypes = "deny"
improper_ctypes_definitions = "deny"
unexpected_cfgs = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_docs_in_private_items = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
allow_attributes = "deny"
multiple_unsafe_ops_per_block = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
let_underscore_must_use = "deny"
as_conversions = "deny"
mem_forget = "deny"
exit = "deny"

[lints.rustdoc]
all = { level = "deny", priority = -1 }
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

# Match the reviewed product optimization/arithmetic policy in this owned lab.
# These settings do not select a shipping component fault policy.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true
debug-assertions = false
panic = "unwind"
incremental = false
debug = "limited"
strip = "none"

[profile.verify-release]
inherits = "release"
debug-assertions = true
