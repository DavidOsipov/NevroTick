[package]
name = "nevrotick-crypto-cng-lifecycle"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-2.0-only"
publish = false
build = false
description = "Held native Windows CNG lifecycle fixture with public API controls"

# Experimental test infrastructure, outside the product workspace.
[workspace]
resolver = "3"
exclude = ["vendor/rustls-cng-crypto"]

[features]
init-probe = ["rustls-cng-crypto/fixture-init-probe"]

[[bin]]
name = "nevrotick-cng-init-probe"
path = "src/bin/init-probe.rs"
required-features = ["init-probe"]

[patch.crates-io]
rustls-cng-crypto = { path = "vendor/rustls-cng-crypto" }

[target.'cfg(windows)'.dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std"] }
rustls-cng-crypto = { version = "=0.1.2", default-features = false }

[lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_unsafe = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unknown_lints = "deny"
renamed_and_removed_lints = "deny"
improper_ctypes = "deny"
improper_ctypes_definitions = "deny"
unexpected_cfgs = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_docs_in_private_items = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
allow_attributes = "deny"
multiple_unsafe_ops_per_block = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
let_underscore_must_use = "deny"
as_conversions = "deny"
mem_forget = "deny"
exit = "deny"

[lints.rustdoc]
all = { level = "deny", priority = -1 }
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
