# Owned CNG lifecycle fixture only; not product/provider adoption.
# Exact source/grants and target graph: tasks/s0.1-crypto-feasibility.md, S47-S49.
# No ring/AWS-LC/private-root exception; exact Windows-link pair only.
# Validated against cargo-deny 0.20.2, not rolling example schemas.
# Run every admitted target/feature row, including build/dev dependencies.
# This bootstrap policy approves no third-party runtime license yet. Extend the
# GPL-2.0-only allowlist only after CHECK-26 exact-graph/license review.
[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 2

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
unmaintained = "all"
unsound = "all"
yanked = "deny"
disable-yank-checking = false
maximum-db-staleness = "P1D"
unused-ignored-advisory = "deny"
ignore = []

[licenses]
allow = ["GPL-2.0-only", "MIT", "Unicode-3.0", "ISC", "BSD-3-Clause"]
confidence-threshold = 1.0
include-dev = true
include-build = true
unused-allowed-license = "deny"
unused-license-exception = "deny"
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
allow-wildcard-paths = false
highlight = "all"
deny = [
    { crate = "ring", reason = "Architecture OPEN-1: exact crypto/native license graph remains held." },
    { crate = "aws-lc-rs", reason = "Architecture OPEN-1: exact crypto/native license graph remains held." },
    { crate = "aws-lc-sys", reason = "Architecture OPEN-1: exact crypto/native license graph remains held." },
    { crate = "aws-lc-fips-sys", reason = "Architecture OPEN-1: AWS-LC native graph remains held." },
]
skip = [{ crate = "windows-link@=0.1.3", reason = "Reviewed KE-only pair: existing Windows 0.61 parents use 0.1.3; verifier windows-sys 0.61.2 uses 0.2.1. Exact parents/features/checksums require separate admission." }]
skip-tree = []

[bans.build]
# Each exception needs a reviewed exact package/checksum and execution boundary.
allow-build-scripts = ["generic-array@0.14.9", "proc-macro2@1.0.107", "quote@1.0.47", "rustls@0.23.46"]
executables = "deny"
interpreted = "deny"
enable-builtin-globs = true
include-dependencies = true
include-workspace = true
include-archives = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
required-git-spec = "rev"
# An approved origin can legitimately be absent from a particular feature row.
unused-allowed-source = "allow"
unused-allowed-org = "deny"

# Presence only: upstream CI helpers, unreachable from this normal build.
# Their network/install effects are not admitted for execution.
# Bind all three exact bytes; archive/cohort and no-build-owner guards still apply.
[[bans.build.bypass]]
crate = "untrusted@0.9.0"
allow = [
  { path = "mk/cargo.sh", checksum = "766c00df2767ac0998000e9b55d076b6dbbeb05ecf4c4d9b317df8551fae1bbe" },
  { path = "mk/install-build-tools.sh", checksum = "90ec3cce41b1660b5103a37803e537ff167bae17badaca2d89f492116555919d" },
  { path = "mk/runner", checksum = "471602c60f4243f87ebf952f8e69c07dfa29d8c69f2ef3885a4c61a2d6bf3b33" },
]
