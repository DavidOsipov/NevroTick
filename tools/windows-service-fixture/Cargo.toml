[package]
name = "nevrotick-windows-service-fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-2.0-only"
repository = "https://github.com/DavidOsipov/NevroTick"
publish = false
build = false
description = "Inert source-only S0.2 laboratory Windows service hosts"

# Experimental infrastructure, deliberately outside the product workspace.
[workspace]
resolver = "3"

[dependencies]
windows-platform = { version = "=0.0.0", path = "../../crates/windows-platform" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Services", "Win32_System_Threading"] }

[[bin]]
name = "nevrotick-lab-s02-engine"
path = "src/bin/engine.rs"

[[bin]]
name = "nevrotick-lab-s02-broker"
path = "src/bin/broker.rs"

[lints]
workspace = true

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_unsafe = "deny"
unused_must_use = "deny"
let_underscore_drop = "deny"
unused_macro_rules = "deny"
unused_lifetimes = "deny"
unfulfilled_lint_expectations = "deny"
unknown_lints = "deny"
renamed_and_removed_lints = "deny"
improper_ctypes = "deny"
improper_ctypes_definitions = "deny"
unexpected_cfgs = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Require a documented contract surface for private helpers as well as public
# APIs. Documentation presence does not prove pre/postconditions are correct.
missing_docs_in_private_items = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
# Prefer checked expectations over permanent local suppressions, and make each
# unsafe block carry one reviewable operation. Keep legitimate used .ok() values.
allow_attributes = "deny"
multiple_unsafe_ops_per_block = "deny"
unused_result_ok = "deny"
string_slice = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
let_underscore_must_use = "deny"
as_conversions = "deny"
mem_forget = "deny"
exit = "deny"

# Stable rustdoc::all also checks crate documentation, code blocks, HTML,
# backticks and private-item examples. Doctests run separately.
# It does not include the nightly-only missing_doc_code_examples lint.
[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true
debug-assertions = false
panic = "unwind"
incremental = false
debug = "limited"
strip = "none"

[profile.verify-release]
inherits = "release"
debug-assertions = true

